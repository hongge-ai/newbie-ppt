<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24">
  <rect id="p08-bg" x="0" y="0" width="1280" height="720" fill="#FAF7F2" />

  <g id="p08-header" data-pptx-bounds="60 38 1160 94">
    <rect x="60" y="44" width="4" height="22" fill="#B83B2A" />
    <text x="74" y="62" font-size="18" font-weight="bold" fill="#B83B2A">贰 · 第三层·抒情 · EMOTIONAL TURNING &amp; TRANSCENDENCE</text>
    <text x="60" y="110" font-family="SimSun, Georgia, serif" font-size="42" font-weight="bold" fill="#1E293B">第三层·抒情转折：从“兴尽悲来”到“不坠青云之志”</text>
    <line x1="60" y1="128" x2="1220" y2="128" stroke="#D8D0C3" stroke-width="1.5" />
  </g>

  <g id="p08-left-flow" data-pptx-bounds="60 150 676 504">
    <rect x="60" y="150" width="676" height="504" rx="4" fill="#FFFFFF" stroke="#D8D0C3" stroke-width="1" />

    <g id="p08-step-1">
      <circle cx="94" cy="190" r="14" fill="#2E6B7E" />
      <text x="94" y="196" font-size="16" font-weight="bold" fill="#FAF7F2" text-anchor="middle">1</text>
      <text x="124" y="196" font-size="22" font-weight="bold" fill="#1E293B">盛极而悲 · 极乐陡转宇宙苍茫（欢娱 → 哲思）</text>
      <text fill="#1F242D" font-size="16" x="124" y="232">承睢园绿竹、邺水朱华之欢，极写“四美具，二难并”胜会，</text><text fill="#1F242D" font-size="16" x="124" y="258">凭高远眺顿生生命有限、盛宴难再的宇宙浩叹：</text><text fill="#2E6B7E" font-size="16" x="124" y="284" font-family="SimSun, Georgia, serif" font-weight="bold">“天高地迥，觉宇宙之无穷；兴尽悲来，识盈虚之有数。”</text></g>

    <line x1="94" y1="300" x2="94" y2="330" stroke="#B83B2A" stroke-width="2" stroke-dasharray="4,4" />

    <g id="p08-step-2">
      <circle cx="94" cy="354" r="14" fill="#B83B2A" />
      <text x="94" y="360" font-size="16" font-weight="bold" fill="#FAF7F2" text-anchor="middle">2</text>
      <text x="124" y="360" font-size="22" font-weight="bold" fill="#1E293B">关山难越 · 千古才士失路之悲（身世 → 四典）</text>
      <text fill="#1F242D" font-size="16" x="124" y="396">叹长安不见、关山难越，连下四典抒发古今通悲：</text><text fill="#B83B2A" font-size="16" x="124" y="422" font-weight="bold">“冯唐易老，李广难封；屈贾谊于长沙，窜梁鸿于海曲。”</text><text fill="#1F242D" font-size="16" x="124" y="448">痛陈圣明时代个体才士因命运不齐而罹受的挫折困厄。</text></g>

    <line x1="94" y1="464" x2="94" y2="494" stroke="#1E293B" stroke-width="2" stroke-dasharray="4,4" />

    <g id="p08-step-3">
      <circle cx="94" cy="518" r="14" fill="#1E293B" />
      <text x="94" y="524" font-size="16" font-weight="bold" fill="#FAF7F2" text-anchor="middle">3</text>
      <text x="124" y="524" font-size="22" font-weight="bold" fill="#1E293B">达人知命 · 绝地反弹挺立人格（逆转 → 突围）</text>
      <text fill="#1F242D" font-size="16" x="124" y="560">以“所赖君子见机，达人知命”陡然逆转绝望之势，</text><text fill="#1F242D" font-size="16" x="124" y="586"><tspan>明确反用魏晋名士典故：<tspan font-weight="bold" fill="#1E293B">“岂效穷途之哭！”</tspan></tspan></text><text fill="#1F242D" font-size="16" x="124" y="612">断然拒绝阮籍之消极沉沦，彰显刚健昂扬的儒家君子风骨。</text></g>
  </g>

  <g id="p08-right-monument" data-pptx-bounds="760 150 460 504">
    <rect x="760" y="150" width="460" height="504" rx="4" fill="#1E293B" />
    <rect x="760" y="150" width="10" height="504" fill="#B83B2A" />

    
  <g transform="translate(788, 174) scale(1.33333)" fill="none" stroke="#B83B2A" stroke-width="2">
    <path d="M12 10.941c2.333 -3.308 .167 -7.823 -1 -8.941c0 3.395 -2.235 5.299 -3.667 6.706c-1.43 1.408 -2.333 3.294 -2.333 5.588c0 3.704 3.134 6.706 7 6.706c3.866 0 7 -3.002 7 -6.706c0 -1.712 -1.232 -4.403 -2.333 -5.588c-2.084 3.353 -3.257 3.353 -4.667 2.235" />
  </g>
    <text x="828" y="198" font-size="20" font-weight="bold" fill="#B83B2A">千古传唱 · 青云立志之骨</text>

    <g id="p08-quote-box" data-pptx-bounds="788 226 408 190">
      <rect x="788" y="226" width="408" height="190" rx="4" fill="#111827" stroke="#B83B2A" stroke-width="1.5" />
      <text font-family="SimSun, Georgia, serif" font-weight="bold" fill="#FAF7F2" font-size="28" x="808" y="274">“老当益壮，</text><text font-family="SimSun, Georgia, serif" font-weight="bold" fill="#FAF7F2" font-size="28" x="808" y="312">宁移白首之心？</text><text font-family="SimSun, Georgia, serif" font-weight="bold" fill="#FAF7F2" font-size="28" x="808" y="360">穷且益坚，</text><text font-family="SimSun, Georgia, serif" font-weight="bold" fill="#FAF7F2" font-size="28" x="808" y="398">不坠青云之志。”</text></g>

    <g font-size="16" fill="#F0EBE1">
      <text x="788" y="454">“酌贪泉而觉爽，处涸辙以犹欢。”</text>
      <text x="788" y="490">“北海虽赊，扶摇可接；</text><text x="788" y="514">东隅已逝，桑榆非晚。”</text></g>

    <line x1="788" y1="544" x2="1196" y2="544" stroke="#374151" stroke-width="1" />
    <text fill="#9CA3AF" font-size="14" x="788" y="574">即使身处逆境，亦决不失掉高尚节操；</text><text fill="#9CA3AF" font-size="14" x="788" y="596">即使昨日受挫，晚景亦可补救发奋；</text><text fill="#9CA3AF" font-size="14" x="788" y="618">此乃《滕王阁序》穿越千年震撼人心的核心源泉。</text></g>

  <g id="p08-footer" data-pptx-bounds="60 672 1160 28" font-size="14" fill="#596273">
