    <rect x="852" y="256" width="368" height="6" rx="3" fill="#1E293B" />
    
  <g transform="translate(876, 278) scale(1.16667)" fill="none" stroke="#1E293B" stroke-width="2">
    <path d="M6 9a6 6 0 1 0 12 0a6 6 0 1 0 -12 0" />
    <path d="M12 15l3.4 5.89l1.598 -3.233l3.598 .232l-3.4 -5.889" />
    <path d="M6.802 12l-3.4 5.89l3.598 -.233l1.598 3.232l3.4 -5.889" />
  </g>
    <text x="914" y="300" font-size="24" font-weight="bold" fill="#1E293B">满座文武高朋</text>
    <text x="876" y="340" font-size="18" font-weight="bold" fill="#1E293B">文武俊彦与谦逊入席</text>
    <text fill="#1F242D" font-size="16" x="876" y="374">盛赞主宾风采：</text><text fill="#1F242D" font-size="16" x="876" y="400">“都督阎公之雅望，棨戟遥临；</text><text fill="#1F242D" font-size="16" x="876" y="426">宇文新州之懿范，襜帷暂驻。”</text><text fill="#1F242D" font-size="16" x="876" y="474">烘托高朋满座：</text><text fill="#1F242D" font-size="16" x="876" y="500">“腾蛟起凤，孟学士之词宗；</text><text fill="#1F242D" font-size="16" x="876" y="526">紫电青霜，王将军之武库。”</text><line x1="876" y1="562" x2="1196" y2="562" stroke="#F0EBE1" stroke-width="1.5" />
    <text fill="#596273" font-size="15" x="876" y="594">末以“童子何知，躬逢胜饯”入题，</text><text fill="#596273" font-size="15" x="876" y="618">既谦逊守礼，又顺理成章引出后文。</text></g>

