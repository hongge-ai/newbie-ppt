    <text x="810" y="200" font-size="26" font-weight="bold" fill="#1E293B">作序年份三大文献考辨</text>

    <rect x="774" y="222" width="420" height="124" rx="4" fill="#FFFFFF" stroke="#D8D0C3" stroke-width="1" />
    <text x="790" y="248" font-size="16" font-weight="bold" fill="#596273">✕ 误传一：《唐摭言》“时年十四”说</text>
    <text fill="#1F242D" font-size="16" x="790" y="276">十四岁在京应举，与序中<tspan font-weight="bold" fill="#1E293B">“等终军之弱冠”</tspan>、</text><text fill="#1F242D" font-size="16" x="790" y="300">“家君作宰”“奉晨昏于万里”矛盾；</text><text fill="#1F242D" font-size="16" x="790" y="324">“童子”实为王勃对在座先达之后辈谦辞。</text><rect x="774" y="362" width="420" height="144" rx="4" fill="#FFFFFF" stroke="#D8D0C3" stroke-width="1" />
    <text x="790" y="388" font-size="16" font-weight="bold" fill="#596273">✕ 旧注二：明清部分选本“咸亨二年”说</text>
    <text fill="#1F242D" font-size="16" x="790" y="416">王勃《春思赋序》自述“咸亨二年旅寓巴蜀”，</text><text fill="#1F242D" font-size="16" x="790" y="440">彼时其父尚未贬交趾，地理行踪皆不符。</text><text fill="#1F242D" font-size="16" x="790" y="464">（注：生卒年主流采 650–676，虚岁二十六）</text><g id="p03-verdict-plaque" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="plaque" data-pptx-frame="772 526 424 96" data-pptx-av-adj="val 12000" fill="#1E293B" stroke="#B83B2A" stroke-width="1.5">
      <path d="M 772 537.52 A 11.52 11.52 0 0 0 783.52 526 L 1184.48 526 A 11.52 11.52 0 0 0 1196 537.52 L 1196 610.48 A 11.52 11.52 0 0 0 1184.48 622 L 783.52 622 A 11.52 11.52 0 0 0 772 610.48 Z" />
    </g>
    <text x="984" y="562" font-size="16" font-weight="bold" fill="#F0EBE1" text-anchor="middle">✓ 学界与统编教材公认定谳（据《旧唐书》）</text>
    <text x="984" y="598" font-family="SimSun, Georgia, serif" font-size="24" font-weight="bold" fill="#FAF7F2" text-anchor="middle">上元二年（675）重阳 · 虚岁二十六</text>
