<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24">
  <rect id="p03-bg" x="0" y="0" width="1280" height="720" fill="#FAF7F2" />

  <g id="p03-header" data-pptx-bounds="60 38 1160 94">
    <rect x="60" y="44" width="4" height="22" fill="#B83B2A" />
    <text x="74" y="62" font-size="18" font-weight="bold" fill="#B83B2A">壹 · 知人论世 · BIOGRAPHICAL CONTEXT</text>
    <text x="60" y="110" font-family="SimSun, Georgia, serif" font-size="42" font-weight="bold" fill="#1E293B">知人论世：从“初唐四杰”之首到万里省父的失路书生</text>
    <line x1="60" y1="128" x2="1220" y2="128" stroke="#D8D0C3" stroke-width="1.5" />
  </g>

  <g id="p03-timeline-col" data-pptx-bounds="60 152 664 504">
    <line x1="88" y1="184" x2="88" y2="596" stroke="#2E6B7E" stroke-width="2.5" stroke-dasharray="8,4" />

    <circle cx="88" cy="184" r="10" fill="#2E6B7E" />
    <text x="114" y="192" font-size="26" font-weight="bold" fill="#1E293B">家学门第与早慧奇才（650–666）</text>
    <text fill="#1F242D" font-size="20" x="114" y="226">隋末大儒<tspan fill="#1E293B" font-weight="bold">“文中子”王通之孙</tspan>，六岁属文、</text><text fill="#1F242D" font-size="20" x="114" y="254">九岁撰《指瑕》摘颜师古《汉书》注疏失；</text><text fill="#1F242D" font-size="20" x="114" y="282"><tspan>未及冠授朝散郎，居<tspan fill="#B83B2A" font-weight="bold">初唐四杰之首</tspan>。</tspan></text><line x1="114" y1="294" x2="700" y2="294" stroke="#D8D0C3" stroke-width="1" />

    <circle cx="88" cy="326" r="10" fill="#B83B2A" />
    <text x="114" y="334" font-size="26" font-weight="bold" fill="#1E293B">第一次重创：沛王府斥逐（666–671）</text>
    <text fill="#1F242D" font-size="20" x="114" y="368">任沛王府修撰，诸王斗鸡时戏作<tspan fill="#B83B2A" font-weight="bold">《檄英王鸡文》</tspan>，</text><text fill="#1F242D" font-size="20" x="114" y="396">高宗怒斥“交构之渐”即日逐出，遂客游巴蜀。</text><line x1="114" y1="416" x2="700" y2="416" stroke="#D8D0C3" stroke-width="1" />

    <circle cx="88" cy="448" r="10" fill="#B83B2A" />
    <text x="114" y="456" font-size="26" font-weight="bold" fill="#1E293B">第二次重创：虢州官奴案除名累父（672–674）</text>
    <text fill="#1F242D" font-size="20" x="114" y="490">补虢州参军，私匿并杀罪奴曹达当诛，</text><text fill="#1F242D" font-size="20" x="114" y="518"><tspan>遇大赦<tspan fill="#B83B2A" font-weight="bold">免死除名</tspan>；连累父亲远贬极南<tspan fill="#1E293B" font-weight="bold">交趾县令</tspan>。</tspan></text><line x1="114" y1="538" x2="700" y2="538" stroke="#D8D0C3" stroke-width="1" />

    <circle cx="88" cy="570" r="12" fill="#1E293B" />
    <text x="114" y="578" font-size="26" font-weight="bold" fill="#B83B2A">绝唱前夜：万里南下途经洪州（675–676）</text>
    <text fill="#1F242D" font-size="20" x="114" y="612">赴交趾省父道出洪州作序；</text><text fill="#1F242D" font-size="20" x="114" y="640">次年（上元三年，676）渡海不幸溺水而卒。</text></g>

