<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24">
  <defs>
    <linearGradient id="p07SkyScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.92"/>
      <stop offset="42%" stop-color="#0F172A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <image id="p07-bg-photo" data-pptx-role="background" href="../images/sunset_lone_wild_duck_hero.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
  <rect id="p07-scrim" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#p07SkyScrim)"/>

  <g id="p07-header" data-pptx-bounds="60 38 1160 94">
    <rect x="60" y="44" width="4" height="22" fill="#B83B2A"/>
    <text x="74" y="62" font-size="18" font-weight="bold" fill="#B83B2A">贰 · 第二层·绘景 · SPATIAL COMPOSITION &amp; ETERNAL SUNSET</text>
    <text x="60" y="110" font-family="SimSun, Georgia, serif" font-size="40" font-weight="bold" fill="#FAF7F2">第二层·绘景：多镜头空间推拉与“落霞孤鹜”千古画境</text>
    <line x1="60" y1="128" x2="1220" y2="128" stroke="#D8D0C3" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>

  <g id="p07-centerpiece" data-pptx-bounds="60 162 1160 138">
    <rect x="180" y="162" width="920" height="120" rx="6" fill="#0F172A" fill-opacity="0.68" stroke="#B83B2A" stroke-width="1.5"/>
    <text x="640" y="214" font-family="SimSun, Georgia, serif" font-size="40" font-weight="bold" fill="#FAF7F2" text-anchor="middle">“落霞与孤鹜齐飞，秋水共长天一色。”</text>
    <text x="640" y="258" font-size="18" fill="#F0EBE1" text-anchor="middle">上下动静交融 · 暮色云霞明灭 · 飞动中见宁穆 · 盛唐诗境第一名联</text>
  </g>

  <g id="p07-card-1" data-pptx-bounds="60 326 368 320">
    <rect x="60" y="326" width="368" height="320" rx="4" fill="#111827" fill-opacity="0.88" stroke="#D8D0C3" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="60" y="326" width="368" height="4" rx="2" fill="#2E6B7E"/>
    <use data-icon="tabler-outline/mountain" x="84" y="348" width="26" height="26" fill="#2E6B7E" stroke-width="2"/>
    <text x="120" y="370" font-size="22" font-weight="bold" fill="#FAF7F2">九月底色与垂直落差</text>
    <text x="84" y="412" font-size="16" fill="#F0EBE1">“潦水尽而寒潭清，<tspan x="84" dy="24">烟光凝而暮山紫。”</tspan></text>
    <text x="84" y="474" font-size="16" fill="#F0EBE1">“层峦耸翠，上出重霄；<tspan x="84" dy="24">飞阁流丹，下临无地。”</tspan></text>
    <line x1="84" y1="538" x2="404" y2="538" stroke="#374151" stroke-width="1"/>
    <text x="84" y="568" font-size="14" fill="#9CA3AF">由清潭暮紫之色，推向凌空出云之阁，<tspan x="84" dy="22">构筑极度强烈的垂直落差与立体透视。</tspan></text>
  </g>

  <g id="p07-card-2" data-pptx-bounds="456 326 368 320">
    <rect x="456" y="326" width="368" height="320" rx="4" fill="#111827" fill-opacity="0.88" stroke="#B83B2A" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="456" y="326" width="368" height="4" rx="2" fill="#B83B2A"/>
    <use data-icon="tabler-outline/sparkles" x="480" y="348" width="26" height="26" fill="#B83B2A" stroke-width="2"/>
    <text x="516" y="370" font-size="22" font-weight="bold" fill="#FAF7F2">点化前贤与境界超越</text>
    <text x="480" y="412" font-size="15" fill="#9CA3AF">化用庾信《马射赋》名句：</text>
    <text x="480" y="440" font-size="15" fill="#E5E7EB">“落花与芝盖同飞，<tspan x="480" dy="24">杨柳共春旗一色。”</tspan></text>
    <line x1="480" y1="500" x2="800" y2="500" stroke="#374151" stroke-width="1"/>
    <text x="480" y="532" font-size="14" fill="#D1D5DB"><tspan font-weight="bold" fill="#B83B2A">脱胎换骨：</tspan>将皇家苑囿人工仪仗，<tspan x="480" dy="22">升华为无边大自然的寥廓生机；</tspan><tspan x="480" dy="22">化春为秋、变滞为灵，卓绝千古。</tspan></text>
  </g>

  <g id="p07-card-3" data-pptx-bounds="852 326 368 320">
    <rect x="852" y="326" width="368" height="320" rx="4" fill="#111827" fill-opacity="0.88" stroke="#D8D0C3" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="852" y="326" width="368" height="4" rx="2" fill="#1E293B"/>
    <use data-icon="tabler-outline/ripple" x="876" y="348" width="26" height="26" fill="#2E6B7E" stroke-width="2"/>
    <text x="912" y="370" font-size="22" font-weight="bold" fill="#FAF7F2">视听延展与千里遐思</text>
    <text x="876" y="412" font-size="16" fill="#F0EBE1">“渔舟唱晚，响穷彭蠡之滨；<tspan x="876" dy="24">雁阵惊寒，声断衡阳之浦。”</tspan></text>
    <line x1="876" y1="478" x2="1196" y2="478" stroke="#374151" stroke-width="1"/>
    <text x="876" y="514" font-size="14" fill="#9CA3AF">由画面的极目远眺转入声音的延展：<tspan x="876" dy="22">渔歌互答震彻鄱阳湖，</tspan><tspan x="876" dy="22">雁叫凄清掠过回雁峰；</tspan><tspan x="876" dy="22">将时空视野瞬间拉伸至千里之外。</tspan></text>
  </g>

  <g id="p07-footer" data-pptx-bounds="60 672 1160 28" font-size="14" fill="#9CA3AF">
    <text x="60" y="692">点化源流：北周庾信《马射赋》、南朝宋鲍照《登大雷岸与妹书》 [F016, F017, F026, F038, F039]</text>
    <text x="1220" y="692" text-anchor="end">07 / 12</text>
  </g>
</svg>