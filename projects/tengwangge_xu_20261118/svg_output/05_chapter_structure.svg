<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="section" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24">
  <defs>
    <linearGradient id="p05LeftScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.72"/>
      <stop offset="45%" stop-color="#111827" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <rect id="p05-bg" x="0" y="0" width="1280" height="720" fill="#FAF7F2"/>

  <g id="p05-left-hero" data-pptx-bounds="0 0 496 720">
    <image href="../images/autumn_hills_chapter.jpg" x="0" y="0" width="496" height="720" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="0" width="496" height="720" fill="url(#p05LeftScrim)"/>
    <rect x="48" y="64" width="96" height="32" rx="3" fill="#B83B2A"/>
    <text x="96" y="87" font-size="18" font-weight="bold" fill="#FAF7F2" text-anchor="middle">第二篇章</text>
    <text x="48" y="168" font-family="SimSun, Georgia, serif" font-size="64" font-weight="bold" fill="#FAF7F2">贰</text>
    <text x="48" y="240" font-family="SimSun, Georgia, serif" font-size="48" font-weight="bold" fill="#FAF7F2">章法总纲：<tspan x="48" dy="60">四层跌宕的</tspan><tspan x="48" dy="60">交响结构</tspan></text>
    <line x1="48" y1="400" x2="220" y2="400" stroke="#B83B2A" stroke-width="3"/>
    <text x="48" y="446" font-size="18" fill="#F0EBE1">全篇七自然段紧扣五重题眼，<tspan x="48" dy="28">由人事入秋景、由欢娱转悲慨、</tspan><tspan x="48" dy="28">由困顿振青云，气脉一贯到底。</tspan></text>
    <text x="48" y="688" font-size="14" fill="#D8D0C3">《古文观止·卷七》结构解析 [F013, F014]</text>
  </g>

  <g id="p05-layer-1" data-pptx-bounds="536 60 684 148">
    <rect x="536" y="60" width="684" height="146" rx="4" fill="#F0EBE1"/>
    <g id="p05-stage1-tag" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="homePlate" data-pptx-frame="536 68 140 34" data-pptx-av-adj="val 22000" fill="#1E293B" stroke="none">
      <path d="M 536 68 L 668.52 68 L 676 85 L 668.52 102 L 536 102 Z"/>
    </g>
    <text x="602" y="92" font-size="16" font-weight="bold" fill="#FAF7F2" text-anchor="middle">第一层 · 述事</text>
    <text x="690" y="93" font-size="22" font-weight="bold" fill="#1E293B">第 1 段 · 扣“洪府”｜基调：庄重轩昂</text>
    <text x="556" y="136" font-size="18" fill="#1F242D">铺陈雄州星宿分野与地灵人杰，盛赞东南宾主并谦辞入席</text>
    <text x="556" y="176" font-family="SimSun, Georgia, serif" font-size="16" fill="#596273">代表句：“物华天宝，龙光射牛斗之墟；人杰地灵，徐孺下陈蕃之榻。”</text>
  </g>

  <g id="p05-layer-2" data-pptx-bounds="536 220 684 148">
    <rect x="536" y="220" width="684" height="146" rx="4" fill="#FFFFFF" stroke="#D8D0C3" stroke-width="1"/>
    <g id="p05-stage2-tag" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="homePlate" data-pptx-frame="536 228 140 34" data-pptx-av-adj="val 22000" fill="#2E6B7E" stroke="none">
      <path d="M 536 228 L 668.52 228 L 676 245 L 668.52 262 L 536 262 Z"/>
    </g>
    <text x="602" y="252" font-size="16" font-weight="bold" fill="#FAF7F2" text-anchor="middle">第二层 · 绘景</text>
    <text x="690" y="253" font-size="22" font-weight="bold" fill="#2E6B7E">第 2–3 段 · 扣“秋日登阁”｜基调：澄澈寥廓</text>
    <text x="556" y="296" font-size="18" fill="#1F242D">由寒潭暮山推向层峦流丹，展水天一色与渔舟雁阵千里远境</text>
    <text x="556" y="336" font-family="SimSun, Georgia, serif" font-size="16" fill="#596273">代表句：“落霞与孤鹜齐飞，秋水共长天一色。”</text>
  </g>

  <g id="p05-layer-3" data-pptx-bounds="536 380 684 148">
    <rect x="536" y="380" width="684" height="146" rx="4" fill="#F0EBE1" stroke="#B83B2A" stroke-width="1.5"/>
    <g id="p05-stage3-tag" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="homePlate" data-pptx-frame="536 388 140 34" data-pptx-av-adj="val 22000" fill="#B83B2A" stroke="none">
      <path d="M 536 388 L 668.52 388 L 676 405 L 668.52 422 L 536 422 Z"/>
    </g>
    <text x="602" y="412" font-size="16" font-weight="bold" fill="#FAF7F2" text-anchor="middle">第三层 · 抒情</text>
    <text x="690" y="413" font-size="22" font-weight="bold" fill="#B83B2A">第 4–5 段 · 扣“饯”｜欢娱转悲慨挺立壮志</text>
    <text x="556" y="456" font-size="18" fill="#1F242D">由管弦胜筵陡转“兴尽悲来”，叹冯唐李广不遇而挺立青云壮志</text>
    <text x="556" y="496" font-family="SimSun, Georgia, serif" font-size="16" fill="#596273">代表句：“老当益壮，宁移白首之心？穷且益坚，不坠青云之志。”</text>
  </g>

  <g id="p05-layer-4" data-pptx-bounds="536 540 684 148">
    <rect x="536" y="540" width="684" height="146" rx="4" fill="#FFFFFF" stroke="#D8D0C3" stroke-width="1"/>
    <g id="p05-stage4-tag" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="homePlate" data-pptx-frame="536 548 140 34" data-pptx-av-adj="val 22000" fill="#1E293B" stroke="none">
      <path d="M 536 548 L 668.52 548 L 676 565 L 668.52 582 L 536 582 Z"/>
    </g>
    <text x="602" y="572" font-size="16" font-weight="bold" fill="#FAF7F2" text-anchor="middle">第四层 · 言志</text>
    <text x="690" y="573" font-size="22" font-weight="bold" fill="#1E293B">第 6–7 段及附诗 · 扣“别序”｜谦恭而旷远</text>
    <text x="556" y="616" font-size="18" fill="#1F242D">自陈弱冠请缨初心与侍父孝思，感恩知遇，赋诗归于长江浩叹</text>
    <text x="556" y="656" font-family="SimSun, Georgia, serif" font-size="16" fill="#596273">代表句：“阁中帝子今何在？槛外长江空自流。”</text>
  </g>

  <g id="p05-page-num" data-pptx-bounds="1140 690 80 24" font-size="14" fill="#596273">
    <text x="1220" y="706" text-anchor="end">05 / 12</text>
  </g>
</svg>
