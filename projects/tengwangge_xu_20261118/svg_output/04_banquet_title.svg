  <rect id="p04-bg" x="0" y="0" width="1280" height="720" fill="#FAF7F2"/>

  <g id="p04-header" data-pptx-bounds="60 38 1160 94">
    <rect x="60" y="44" width="4" height="22" fill="#B83B2A"/>
    <text x="74" y="62" font-size="18" font-weight="bold" fill="#B83B2A">壹 · 重阳本事与题解 · OCCASION &amp; TITLE ANATOMY</text>
    <text x="60" y="110" font-family="SimSun, Georgia, serif" font-size="42" font-weight="bold" fill="#1E293B">重阳本事与题解：一场暗藏机锋的江南名楼雅集</text>
    <line x1="60" y1="128" x2="1220" y2="128" stroke="#D8D0C3" stroke-width="1.5"/>
  </g>

  <g id="p04-banquet-story" data-pptx-bounds="60 150 684 226">
    <use data-icon="tabler-outline/sparkles" x="60" y="156" width="26" height="26" fill="#B83B2A" stroke-width="2"/>
    <text x="94" y="177" font-size="24" font-weight="bold" fill="#1E293B">当筵受笔与“腹稿”成篇（名楼落成与侍吏三报）</text>
    <text x="60" y="214" font-size="18" fill="#1F242D">滕王阁始建于永徽四年（653）；上元二年都督<tspan fill="#1E293B" font-weight="bold">阎伯屿</tspan>重修落成，九月九日设宴。<tspan x="60" dy="28">阎公本欲夸示婿作，王勃抗然受笔、磨墨酣卧，寤而挥毫成千古绝唱：</tspan></text>

    <g id="p04-rep1-shape" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="homePlate" data-pptx-frame="60 298 226 58" data-pptx-av-adj="val 25000" fill="#F0EBE1" stroke="#D8D0C3" stroke-width="1">
      <path d="M 60 298 L 271.5 298 L 286 327 L 271.5 356 L 60 356 Z"/>
    </g>
    <g id="p04-rep2-shape" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="282 298 226 58" data-pptx-av-adj="val 25000" fill="#2E6B7E" stroke="none">
      <path d="M 282 298 L 493.5 298 L 508 327 L 493.5 356 L 282 356 L 296.5 327 Z"/>
    </g>
    <g id="p04-rep3-shape" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="504 298 236 58" data-pptx-av-adj="val 25000" fill="#B83B2A" stroke="none">
      <path d="M 504 298 L 725.5 298 L 740 327 L 725.5 356 L 504 356 L 518.5 327 Z"/>
    </g>
    <text x="166" y="322" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">初报：豫章故郡</text>
    <text x="166" y="345" font-size="14" fill="#596273" text-anchor="middle">哂曰“亦是老生常谈”</text>
    <text x="394" y="322" font-size="18" font-weight="bold" fill="#FAF7F2" text-anchor="middle">再报：星分翼轸</text>
    <text x="394" y="345" font-size="14" fill="#F0EBE1" text-anchor="middle">沉吟不言，渐觉不凡</text>
    <text x="622" y="322" font-size="18" font-weight="bold" fill="#FAF7F2" text-anchor="middle">终报：落霞孤鹜</text>
    <text x="622" y="345" font-size="14" fill="#FAF7F2" text-anchor="middle">矍然赞“真天才，垂不朽”</text>
  </g>

  <line id="p04-mid-rule" data-pptx-role="decoration" x1="60" y1="392" x2="740" y2="392" stroke="#D8D0C3" stroke-width="1"/>

  <g id="p04-title-anatomy" data-pptx-bounds="60 408 684 248">
    <use data-icon="tabler-outline/feather" x="60" y="414" width="26" height="26" fill="#2E6B7E" stroke-width="2"/>
    <text x="94" y="437" font-size="28" font-weight="bold" fill="#1E293B">双重文体与原题五要素总纲</text>

    <rect x="60" y="462" width="188" height="176" rx="4" fill="#1E293B"/>
    <text x="154" y="506" font-family="SimSun, Georgia, serif" font-size="26" font-weight="bold" fill="#FAF7F2" text-anchor="middle">《秋日登洪府<tspan x="154" dy="36">滕王阁</tspan><tspan x="154" dy="36">饯别序》</tspan></text>
    <text x="154" y="616" font-size="14" fill="#D8D0C3" text-anchor="middle">赠序 + 诗序 双重文体</text>

    <g id="p04-title-brace" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="leftBrace" data-pptx-frame="258 456 22 186" fill="none" stroke="#B83B2A" stroke-width="2">
      <path d="M 280 642 A 11 1.83 0 0 1 269 640.17 L 269 550.83 A 11 1.83 0 0 0 258 549 A 11 1.83 0 0 0 269 547.17 L 269 457.83 A 11 1.83 0 0 1 280 456 Z" stroke="none"/>
