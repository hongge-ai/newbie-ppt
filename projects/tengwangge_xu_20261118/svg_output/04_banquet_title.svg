    </g>

    <g font-size="18" fill="#1F242D">
      <text x="292" y="482"><tspan fill="#B83B2A" font-weight="bold">【洪府】</tspan>地望形胜与人文渊薮（对应第 1 段）</text>
      <text x="292" y="518"><tspan fill="#2E6B7E" font-weight="bold">【秋日】</tspan>九月三秋寒潭暮山时令（对应第 2 段）</text>
      <text x="292" y="554"><tspan fill="#2E6B7E" font-weight="bold">【登滕王阁】</tspan>层峦流丹与水天远眺（对应第 2–3 段）</text>
      <text x="292" y="590"><tspan fill="#B83B2A" font-weight="bold">【饯】</tspan>管弦胜筵转入兴尽悲来与立志（第 4–5 段）</text>
      <text x="292" y="626"><tspan fill="#1E293B" font-weight="bold">【别序】</tspan>临别自叙孝思并赋四韵八句诗（第 6–7 段）</text>
    </g>
  </g>

  <g id="p04-photo-panel" data-pptx-bounds="768 152 452 500">
    <image href="../images/tengwang_pavilion_banquet.jpg" x="768" y="152" width="452" height="500" preserveAspectRatio="xMidYMid slice"/>
    <rect x="768" y="152" width="452" height="500" fill="url(#p04PhotoFade)"/>
    <rect x="768" y="152" width="452" height="500" fill="none" stroke="#D8D0C3" stroke-width="1"/>
    <rect x="788" y="556" width="4" height="72" fill="#B83B2A"/>
    <text x="804" y="582" font-family="SimSun, Georgia, serif" font-size="26" font-weight="bold" fill="#FAF7F2">“层峦耸翠，上出重霄；<tspan x="804" dy="34">飞阁流丹，下临无地。”</tspan></text>
  </g>

  <g id="p04-footer" data-pptx-bounds="60 672 1160 28" font-size="14" fill="#596273">
